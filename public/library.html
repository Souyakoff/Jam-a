<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data:">
  <title>Bibliothèque</title>
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <main class="library">
    <h1><i data-icon="library" data-size="26"></i>Bibliothèque</h1>

    <div class="library-bar">
      <div class="sections">
        <button data-section="favoris"><i data-icon="star"></i>Favoris</button>
        <button data-section="historique"><i data-icon="history"></i>Historique</button>
      </div>
      <div class="search-field">
        <i data-icon="search"></i>
        <input id="search" type="search" placeholder="Rechercher…" autofocus>
      </div>
      <button id="clear-history" class="danger" hidden><i data-icon="trash"></i>Effacer l’historique</button>
    </div>

    <div id="list"></div>
  </main>

  <script src="../dist/icons.js"></script>
  <script src="../dist/pages/entry.js"></script>
  <script src="../dist/pages/library.js"></script>
</body>
</html>
