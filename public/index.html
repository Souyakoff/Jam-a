<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self'">
  <title>Jam&lt;a</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="tabbar">
    <div id="tabs"></div>
    <button id="new-tab" class="icon" title="Nouvel onglet (Ctrl+T)"><i data-icon="plus"></i></button>
  </div>

  <div id="toolbar">
    <button id="back" class="icon" title="Précédent (Alt+←)"><i data-icon="arrow-left"></i></button>
    <button id="forward" class="icon" title="Suivant (Alt+→)"><i data-icon="arrow-right"></i></button>
    <button id="reload" class="icon" title="Recharger (Ctrl+R)">
      <span class="when-idle"><i data-icon="reload"></i></span>
      <span class="when-loading"><i data-icon="x"></i></span>
    </button>
    <button id="home" class="icon" title="Accueil"><i data-icon="home"></i></button>

    <form id="address-form">
      <input id="address" type="text" spellcheck="false" autocomplete="off"
             placeholder="Rechercher ou saisir une adresse (Ctrl+L)">
      <div id="address-actions">
        <button id="zoom" type="button" title="Réinitialiser le zoom (Ctrl+0)" hidden>
          <i data-icon="zoom-in" data-size="14"></i><span id="zoom-level">100 %</span>
        </button>
        <button id="bookmark" type="button" title="Ajouter aux favoris (Ctrl+D)"><i data-icon="star"></i></button>
      </div>
    </form>

    <span id="shield" class="status" title="Pubs et traqueurs bloqués sur cet onglet">
      <i data-icon="shield"></i><span id="blocked">0</span>
    </span>
    <button id="issues" class="tool" title="Erreurs de la page expliquées (Ctrl+Shift+E)">
      <i data-icon="bug"></i><span id="issue-count">0</span>
    </button>
    <span class="separator"></span>
    <button id="downloads" class="icon" title="Téléchargements (Ctrl+J)">
      <i data-icon="download"></i>
      <span id="download-badge" hidden></span>
      <span id="download-progress" hidden><span></span></span>
    </button>
    <button id="library" class="icon" title="Favoris et historique (Ctrl+Shift+O / Ctrl+H)"><i data-icon="library"></i></button>
    <button id="responsive" class="icon" title="Mode mobile (Ctrl+Shift+M)"><i data-icon="smartphone"></i></button>
    <button id="clear" class="icon" title="Vider le cache et les cookies de ce site"><i data-icon="eraser"></i></button>
    <button id="devtools" class="icon" title="Outils de développement (F12)"><i data-icon="code"></i></button>
  </div>

  <div id="findbar" hidden>
    <i data-icon="search"></i>
    <input id="find-input" type="text" spellcheck="false" autocomplete="off" placeholder="Rechercher dans la page">
    <span id="find-count"></span>
    <button id="find-prev" class="icon" title="Précédent (Maj+Entrée)"><i data-icon="chevron-up"></i></button>
    <button id="find-next" class="icon" title="Suivant (Entrée)"><i data-icon="chevron-down"></i></button>
    <button id="find-close" class="icon" title="Fermer (Échap)"><i data-icon="x"></i></button>
  </div>

  <aside id="panel" hidden>
    <header>
      <h2><i data-icon="bug"></i>Erreurs de la page</h2>
      <button id="panel-close" class="icon" title="Fermer (Ctrl+Shift+E)"><i data-icon="x"></i></button>
    </header>
    <div id="panel-actions">
      <button id="panel-console" class="tool"><i data-icon="terminal"></i>Ouvrir la console (F12)</button>
      <button id="panel-clear" class="tool"><i data-icon="trash"></i>Effacer</button>
    </div>
    <div id="issue-list"></div>
  </aside>

  <script src="../dist/icons.js"></script>
  <script src="../dist/renderer.js"></script>
</body>
</html>
